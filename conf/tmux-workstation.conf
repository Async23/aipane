# aipane — tmux workstation for multi-agent CLI use (public fragment)
#
# Install (optional; not loaded by init.zsh):
#   source-file /path/to/aipane/conf/tmux-workstation.conf
# Pair with:
#   conf/ghostty-tmux.conf     (Cmd chords → this prefix)
#   conf/tmux-window-wrap.conf (multi-line window list)
#
# Keep personal: TPM plugins, theme experiments, machine-only binds.
# Prefix is C-Space so Ghostty can send it as \x00 via Cmd+S / Cmd+chords.

# ══════════════════════════════════════════════════════
#  Basics
# ══════════════════════════════════════════════════════
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"
set -as terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -sg repeat-time 300
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g xterm-keys on
set -s focus-events on
set -g detach-on-destroy off
set -g set-titles on
set -s extended-keys on
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ══════════════════════════════════════════════════════
#  Prefix: C-Space (Ghostty Cmd+S / Cmd+chords)
# ══════════════════════════════════════════════════════
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ══════════════════════════════════════════════════════
#  Windows / sessions
# ══════════════════════════════════════════════════════
bind c new-window -c "#{pane_current_path}"
bind C-c new-session
bind N new-session
bind x kill-pane
bind W confirm-before -p "Kill session #S? (y/n)" kill-session

# ══════════════════════════════════════════════════════
#  Splits
# ══════════════════════════════════════════════════════
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ══════════════════════════════════════════════════════
#  Pane focus (zoom-aware; [ ] reclaimed from copy-mode)
# ══════════════════════════════════════════════════════
bind [ if-shell -F "#{window_zoomed_flag}" \
  "select-pane -t :.- ; resize-pane -Z" \
  "select-pane -t :.-"
bind ] if-shell -F "#{window_zoomed_flag}" \
  "select-pane -t :.+ ; resize-pane -Z" \
  "select-pane -t :.+"
bind -r h if-shell -F "#{window_zoomed_flag}" \
  "select-pane -L ; resize-pane -Z" "select-pane -L"
bind -r j if-shell -F "#{window_zoomed_flag}" \
  "select-pane -D ; resize-pane -Z" "select-pane -D"
bind -r k if-shell -F "#{window_zoomed_flag}" \
  "select-pane -U ; resize-pane -Z" "select-pane -U"
bind -r l if-shell -F "#{window_zoomed_flag}" \
  "select-pane -R ; resize-pane -Z" "select-pane -R"

# ══════════════════════════════════════════════════════
#  Window order / jump
# ══════════════════════════════════════════════════════
bind p previous-window
bind 0 select-window -t '{end}'
bind -n M-< swap-window -d -t :-1
bind -n M-> swap-window -d -t :+1

# ══════════════════════════════════════════════════════
#  Resize without prefix (Option+Shift+HJKL; needs option-as-alt)
# ══════════════════════════════════════════════════════
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# ══════════════════════════════════════════════════════
#  Move panes / windows across the tree
# ══════════════════════════════════════════════════════
bind > swap-pane -D
bind < swap-pane -U
bind ! break-pane
bind m choose-tree -s "move-window -t '%%'"
bind S choose-tree 'move-pane -v -s "%%"'
bind V choose-tree 'move-pane -h -s "%%"'

# ══════════════════════════════════════════════════════
#  Vi copy-mode (prefix+v; y = pbcopy)
#  Y = optional tmux-shot screenshot (https://github.com/Async23/tmux-shot)
# ══════════════════════════════════════════════════════
set -g mode-keys vi
bind v copy-mode
bind b paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y if-shell -F '#{selection_present}' \
  'run-shell -b "tmux-shot-capture #{selection_start_y} #{selection_end_y} #{history_size} --open --clipboard" ; \
   send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'display-message "No selection"'

# ══════════════════════════════════════════════════════
#  Status chrome (window list rows come from tmux-window-wrap)
# ══════════════════════════════════════════════════════
set -g status-style "bg=colour8,fg=colour7"
set -g status-left "#[fg=blue]#[bold] #S "
set -g status-right "#{?pane_synchronized,#[bg=yellow]#[fg=black]#[bold] SYNC #[default],}#[fg=colour7] %m-%d %H:%M "
set -g status-left-length 30
set -g status-right-length 200

set -g pane-border-lines heavy
set -g pane-border-style "fg=colour7"
set -g pane-active-border-style "fg=blue"
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

# Pane top bar: focus / zoom / broadcast
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=blue]#[bg=blue]#[fg=colour15]#[bold] #P ● ● ● #[bg=default]#[fg=blue]#[default]#{?window_zoomed_flag,  #[fg=yellow]⤢#[default] ,}#{?pane_synchronized,#{?pane_input_off,, #[fg=red] ▶ ▶ ▶#[default]},} #{pane_title} ,#[fg=colour8] #P#{?pane_synchronized,#{?pane_input_off,, #[fg=red] ▶ ▶ ▶#[fg=colour8]},} #{pane_title} }"

# Double-click a status window label → zoom that window's current pane
bind -n DoubleClick1Status resize-pane -Z -t =

# ══════════════════════════════════════════════════════
#  Broadcast (iTerm2-style; Ghostty: Cmd+Opt+I / Cmd+Opt+Shift+I)
# ══════════════════════════════════════════════════════
bind B set-option -w synchronize-panes \
  \; run-shell -b "$HOME/.local/bin/tmux-window-wrap invalidate" \
  \; display "#{?pane_synchronized,Broadcast ON,Broadcast OFF} (current window)"

bind e if-shell -F "#{pane_input_off}" \
  "select-pane -e ; display 'Pane input ON (participating in sync)'" \
  "select-pane -d ; display 'Pane input OFF (excluded from sync)'"

unbind A
unbind O

# Pane id popup
bind Q display-popup -w 50 -h 12 "tmux list-panes -F '#{pane_index}: #{pane_id}  #{pane_current_command}'"
