# aipane — tmux workstation for multi-agent CLI use (public fragment)
#
# Install (optional; not loaded by init.zsh):
#   source-file /path/to/aipane/conf/tmux-workstation.conf
# Pair with:
#   conf/ghostty-tmux.conf     (Cmd chords → this prefix)
#   conf/tmux-window-wrap.conf (multi-line window list)
#
# Keep personal: TPM plugins, theme experiments, machine-only binds.
# Prefix is C-Space so Ghostty can send it as \x00 via Cmd+S / one-shot Cmd chords.

# ══════════════════════════════════════════════════════
#  Basics
# ══════════════════════════════════════════════════════
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"
set -as terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -sg repeat-time 300
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -goq @tmux-window-jump-timeout-ms '700'
set -goq @aipane-agent-status-command 'tmux-window-wrap'
set -goq @aipane-close-window-popup-command 'tmux-close-window-popup'
setw -g xterm-keys on
set -s focus-events on
set -g detach-on-destroy off
set -g set-titles on
set -s extended-keys on
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ══════════════════════════════════════════════════════
#  Prefix: C-Space (Ghostty Cmd+S / one-shot Cmd chords)
# ══════════════════════════════════════════════════════
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ══════════════════════════════════════════════════════
#  Windows / sessions
# ══════════════════════════════════════════════════════
bind c new-window -a -c "#{pane_current_path}"
bind C-c new-session
bind N new-session
# Shared by last-pane close and both window tab context menus. Expand this only
# at invocation (E:); double hashes defer the pane-list and menu-title formats.
# Capture the window ID before probing so focus/index changes cannot retarget it.
# The popup handles click coordinates itself: tmux 3.7b menus can execute a
# stale keyboard selection when the user clicks a different row.
set -g @aipane-close-window-command 'panes=$(tmux list-panes -t "#{window_id}" -F "##{pane_id}") || exit 0; \
  test -n "$panes" || exit 0; \
  confirm=0; \
  for pane in $panes; do \
    if status=$(#{q:@aipane-agent-status-command} pane-agent-status --pane "$pane" 2>/dev/null) && test "$status" = none; then continue; fi; \
    confirm=1; break; \
  done; \
  if test "$confirm" = 0; then tmux kill-window -t "#{window_id}"; \
  elif command -v #{q:@aipane-close-window-popup-command} >/dev/null 2>&1; then \
    tmux display-popup -E -c #{q:client_name} -t "#{window_id}" -T " Close window ##I:##W? " -x C -y C -w 40 -h 4 -d / #{q:@aipane-close-window-popup-command} "#{window_id}"; \
  else tmux display-message -c #{q:client_name} "Close cancelled: install tmux-close-window-popup"; fi'

# Keep ordinary split cleanup instant; closing the last pane closes its window.
bind x if-shell -F '#{==:#{window_panes},1}' \
  'run-shell -b -c / "#{E:@aipane-close-window-command}"' \
  'kill-pane'
bind W confirm-before -p "Kill session #S? (y/n)" kill-session

# Rename the originating window in a centered popup.
# Ghostty Cmd+I sends prefix+,; run-shell expands window_id before popup -e.
bind , run-shell -C 'display-popup -E -b rounded -w 52 -h 5 -x C -y C -T "#[align=centre] Rename window #I " -e "AIPANE_RENAME_WINDOW_TARGET=#{window_id}" "$HOME/.local/bin/tmux-rename-window-popup"'

# ══════════════════════════════════════════════════════
#  Splits & layouts
# ══════════════════════════════════════════════════════
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Proportional main pane (overrides tmux's fixed 80-col / 24-row defaults).
setw -g main-pane-width 50%
setw -g main-pane-height 50%

# Cycle only curated layouts: main-vertical → tiled → even-horizontal
# (2 panes deduplicate main-vertical and even-horizontal into a 2-way toggle).
# Support both v1 layout strings (tmux <= 3.7) and v2 JSON layouts (tmux 3.8+).
bind Space if-shell -F '#{||:#{m/r:^[0-9a-f]+.[0-9]+x[0-9]+.0.0\[,#{window_layout}},#{m/r:"L":."t":"v",#{window_layout}}}' {
  select-layout even-horizontal
} {
  if-shell -F '#{||:#{?#{m/r:^."V":,#{window_layout}},#{m:*"t":"v"*,#{window_layout}},#{m/r:\[,#{window_layout}}},#{==:#{window_panes},2}}' {
    select-layout tiled
  } {
    select-layout main-vertical
  }
}

# ══════════════════════════════════════════════════════
#  Pane focus (zoom-aware; [ ] reclaimed from copy-mode)
# ══════════════════════════════════════════════════════
bind [ if-shell -F "#{window_zoomed_flag}" \
  "select-pane -t :.- ; resize-pane -Z" \
  "select-pane -t :.-"
bind ] if-shell -F "#{window_zoomed_flag}" \
  "select-pane -t :.+ ; resize-pane -Z" \
  "select-pane -t :.+"
bind -r h if-shell -F "#{window_zoomed_flag}" \
  "select-pane -L ; resize-pane -Z" "select-pane -L"
bind -r j if-shell -F "#{window_zoomed_flag}" \
  "select-pane -D ; resize-pane -Z" "select-pane -D"
bind -r k if-shell -F "#{window_zoomed_flag}" \
  "select-pane -U ; resize-pane -Z" "select-pane -U"
bind -r l if-shell -F "#{window_zoomed_flag}" \
  "select-pane -R ; resize-pane -Z" "select-pane -R"

# ══════════════════════════════════════════════════════
#  Window order / jump
# ══════════════════════════════════════════════════════
bind p previous-window
bind 1 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 1 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=1"; fi'
bind 2 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 2 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=2"; fi'
bind 3 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 3 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=3"; fi'
bind 4 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 4 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=4"; fi'
bind 5 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 5 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=5"; fi'
bind 6 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 6 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=6"; fi'
bind 7 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 7 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=7"; fi'
bind 8 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 8 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=8"; fi'
bind 9 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 9 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=9"; fi'
bind 0 run-shell -c / 'if [ -x "$HOME/.local/bin/tmux-window-jump" ]; then "$HOME/.local/bin/tmux-window-jump" select 0 "#{client_pid}" "#{q:session_id}"; else tmux select-window -t "#{q:session_id}:=0" 2>/dev/null || tmux select-window -t "#{q:session_id}:=10"; fi'
# Bind both legacy Meta and extended-keys M-S-* (tmux 3.8+ enables extkeys on
# Ghostty, which sends Alt+Shift keys as modifyOtherKeys=2 with explicit Shift).
bind -n M-< swap-window -d -t :-1
bind -n M-> swap-window -d -t :+1
bind -n M-S-< swap-window -d -t :-1
bind -n M-S-> swap-window -d -t :+1

# ══════════════════════════════════════════════════════
#  Resize without prefix (Option+Shift+HJKL; needs option-as-alt)
# ══════════════════════════════════════════════════════
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2
bind -n M-S-H resize-pane -L 2
bind -n M-S-J resize-pane -D 2
bind -n M-S-K resize-pane -U 2
bind -n M-S-L resize-pane -R 2

# ══════════════════════════════════════════════════════
#  Move panes / windows across the tree
# ══════════════════════════════════════════════════════
bind > swap-pane -D
bind < swap-pane -U
bind ! break-pane
bind m choose-tree -s "move-window -t '%%'"
bind S choose-tree 'move-pane -v -s "%%"'
bind V choose-tree 'move-pane -h -s "%%"'

# ══════════════════════════════════════════════════════
#  Vi copy-mode (prefix+v; y = pbcopy)
#  Y = optional tmux-shot screenshot (https://github.com/Async23/tmux-shot)
# ══════════════════════════════════════════════════════
set -g mode-keys vi
# Native copy-mode line numbers (tmux 3.7+; ignored by older versions).
set -gq copy-mode-line-numbers absolute
bind v copy-mode
bind b paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# tmux 3.7 goto-line scrolls the viewport without moving the cursor. Align it
# with the absolute number, including rows in the final screen of history.
bind -T copy-mode-vi : command-prompt -p "(goto line)" {
  if-shell -F '#{m/r:^(absolute|relative|hybrid)$,#{copy-mode-line-numbers}}' {
    if-shell -F '#{m/r:^[0-9]+$,%1}' {
      send-keys -X goto-line -- '%1'
      send-keys -X top-line
      if-shell -F '#{e|>:%1,#{copy_position}}' {
        send-keys -X -N '#{e|-:#{?#{e|>:%1,#{copy_position_limit}},#{copy_position_limit},%1},#{copy_position}}' cursor-down
      }
    }
  } {
    send-keys -X goto-line -- '%1'
  }
}
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y if-shell -F '#{selection_present}' \
  'run-shell -b -c / "tmux-shot-capture #{selection_start_y} #{selection_end_y} #{history_size} --open --clipboard" ; \
   send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'display-message "No selection"'

# ══════════════════════════════════════════════════════
#  Status chrome (window list rows come from tmux-window-wrap)
# ══════════════════════════════════════════════════════
set -g status-style "bg=colour8,fg=colour7"
set -g status-left "#[fg=blue]#[bold] #S "
set -g status-right "#{?pane_synchronized,#[bg=yellow]#[fg=black]#[bold] SYNC #[default],}#[fg=colour7] %m-%d %H:%M "
set -g status-left-length 30
set -g status-right-length 200

# Toggle session statusline (Ghostty: Cmd+B).
# Restore cached multi-line height immediately, then invalidate wrap cache.
bind T if-shell -F '#{==:#{status},off}' {
  set-option -F status '#{?@tmux-window-wrap-row-2,3,#{?@tmux-window-wrap-row-1,2,on}}'
  run-shell -b -c / 'if [ -x "$HOME/.local/bin/tmux-window-wrap" ]; then "$HOME/.local/bin/tmux-window-wrap" invalidate; fi'
} {
  set-option status off
}

set -g pane-border-lines heavy
set -g pane-border-style "fg=colour7"
set -g pane-active-border-style "fg=blue"
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

# Pane top bar: focus / zoom / broadcast / input disabled
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=blue]#[bg=blue]#[fg=colour61]#[bold] #P ● ● ● #[bg=default]#[fg=blue]#[default]#{?window_zoomed_flag,  #[fg=yellow]⤢#[default] ,}#{?pane_input_off, #[bg=red]#[fg=colour231]#[bold] OFF #[default],#{?pane_synchronized, #[fg=red] ▶ ▶ ▶#[default],}} #{pane_title} ,#[fg=colour8] #P#{?pane_input_off, #[bg=red]#[fg=colour231]#[bold] OFF #[default]#[fg=colour8],#{?pane_synchronized, #[fg=red] ▶ ▶ ▶#[fg=colour8],}} #{pane_title} }"

# Browser-style status window tab drag reorder (insert & shift via adjacent
# session-scoped slot swaps). Per-client hidden global env vars isolate
# concurrent clients, verify tmux-window-wrap visible rows before acting,
# guard copy-mode / pane drags, and prevent stale delayed double-click zooms.
set -g @aipane-status-slot-fresh '#{||:#{!:#{m:*@tmux-window-wrap-row-0*,#{status-format[0]}}},#{m/r:##\{==:##\{window_id\#}#,#{window_id}\#}#,##\[range=window\|#{window_index}\],#{@tmux-window-wrap-row-0}#{@tmux-window-wrap-row-1}#{@tmux-window-wrap-row-2}}}'
set -g @aipane-status-drag-clear-command 'set-environment -gu AIPANE_STATUS_DRAG_#{client_pid} ; set-environment -gu AIPANE_STATUS_DBLCLICK_#{client_pid}'
set -g @aipane-status-click-clear-command 'set-environment -gu AIPANE_STATUS_DRAG_#{client_pid} ; set-environment -gu AIPANE_STATUS_CLICK_#{client_pid} ; set-environment -gu AIPANE_STATUS_DBLCLICK_#{client_pid}'
set -g @aipane-status-drag-reorder-command 'set -f; sid=#{q:session_id}; pid=#{client_pid}; dst_idx=#{window_index}; dst_win=#{window_id}; val='\''#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}'\''; \
  old_ifs=$IFS; IFS="|"; set -- $val; IFS=$old_ifs; \
  src_snum=${1-}; src_idx=${2-}; src_win=${3-}; snum=${sid#\$}; \
  test -n "$src_snum" && test -n "$snum" && test -n "$src_idx" && test -n "$dst_idx" || exit 0; \
  case "$src_snum$snum$src_idx$dst_idx" in *[!0-9]*) exit 0 ;; esac; \
  test "$src_snum" = "$snum" && test "$src_idx" != "$dst_idx" || exit 0; \
  windows=$(tmux list-windows -t "$sid" -F "##{window_index}:##{window_id}") || exit 0; \
  src_ok=0; dst_ok=0; slots=""; \
  for pair in $windows; do \
    idx=${pair%%:*}; wid=${pair#*:}; \
    if test "$idx" = "$src_idx" && test "$wid" = "$src_win"; then src_ok=1; fi; \
    if test "$idx" = "$dst_idx" && test "$wid" = "$dst_win"; then dst_ok=1; fi; \
    if test "$src_idx" -lt "$dst_idx"; then \
      if test "$idx" -ge "$src_idx" && test "$idx" -le "$dst_idx"; then slots="$slots $idx"; fi; \
    else \
      if test "$idx" -ge "$dst_idx" && test "$idx" -le "$src_idx"; then slots="$idx $slots"; fi; \
    fi; \
  done; \
  test "$src_ok" = 1 && test "$dst_ok" = 1 || exit 0; \
  prev=""; set --; \
  for cur in $slots; do \
    if test -n "$prev"; then \
      if test "$#" -gt 0; then set -- "$@" ";"; fi; \
      set -- "$@" swap-window -d -s "${sid}:=${prev}" -t "${sid}:=${cur}"; \
    fi; \
    prev=$cur; \
  done; \
  test "$#" -gt 0 && exec tmux "$@"'

bind -n MouseDown1Status {
  if-shell -F -t = '#{E:@aipane-status-slot-fresh}' {
    switch-client -t =
    run-shell -C -t = 'set-environment -gh AIPANE_STATUS_DRAG_#{client_pid} "#{s/[$]//:session_id}|#{window_index}|#{window_id}" ; set-environment -gh AIPANE_STATUS_CLICK_#{client_pid} "#{s/[$]//:session_id}|#{window_id}" ; set-environment -gu AIPANE_STATUS_DBLCLICK_#{client_pid}'
  } {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  }
}
bind -n SecondClick1Status {
  if-shell -F -t = '#{E:@aipane-status-slot-fresh}' {
    switch-client -t =
    if-shell -F -t = '#{==:#{E:##{AIPANE_STATUS_CLICK_#{client_pid}#}},#{s/[$]//:session_id}|#{window_id}}' {
      run-shell -C -t = 'set-environment -gh AIPANE_STATUS_DBLCLICK_#{client_pid} "#{s/[$]//:session_id}|#{window_id}"'
    } {
      run-shell -C 'set-environment -gu AIPANE_STATUS_DBLCLICK_#{client_pid}'
    }
    run-shell -C -t = 'set-environment -gh AIPANE_STATUS_DRAG_#{client_pid} "#{s/[$]//:session_id}|#{window_index}|#{window_id}" ; set-environment -gh AIPANE_STATUS_CLICK_#{client_pid} "#{s/[$]//:session_id}|#{window_id}"'
  } {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  }
}
bind -n TripleClick1Status {
  if-shell -F -t = '#{E:@aipane-status-slot-fresh}' {
    switch-client -t =
    run-shell -C -t = 'set-environment -gh AIPANE_STATUS_DRAG_#{client_pid} "#{s/[$]//:session_id}|#{window_index}|#{window_id}" ; set-environment -gh AIPANE_STATUS_CLICK_#{client_pid} "#{s/[$]//:session_id}|#{window_id}" ; set-environment -gu AIPANE_STATUS_DBLCLICK_#{client_pid}'
  } {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  }
}
bind -n MouseDrag1Status {
  run-shell -C 'set-environment -gu AIPANE_STATUS_CLICK_#{client_pid} ; set-environment -gu AIPANE_STATUS_DBLCLICK_#{client_pid}'
}
bind -n MouseUp1Status {
  run-shell -C 'set-environment -gu AIPANE_STATUS_DRAG_#{client_pid}'
}
bind -n MouseDragEnd1Status {
  if-shell -F -t = '#{&&:#{E:@aipane-status-slot-fresh},#{m/r:^[0-9]+\|[0-9]+\|@[0-9]+$,#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}}}' {
    run-shell -c / -t = "#{E:@aipane-status-drag-reorder-command}"
  }
  run-shell -C '#{E:@aipane-status-click-clear-command}'
}
# Double-click a status window label → zoom that window's current pane
# Only zoom when both clicks landed on the same fresh window without an intervening drag.
bind -n DoubleClick1Status {
  if-shell -F -t = '#{&&:#{E:@aipane-status-slot-fresh},#{==:#{E:##{AIPANE_STATUS_DBLCLICK_#{client_pid}#}},#{s/[$]//:session_id}|#{window_id}}}' {
    resize-pane -Z -t =
  }
  run-shell -C 'set-environment -gu AIPANE_STATUS_DBLCLICK_#{client_pid}'
}

# Clear per-client drag state on cancelled releases (including modifier-held and
# coalesced cross-range ups), non-tab clicks, copy-mode drags, and client lifecycle.
bind -n MouseDown1StatusDefault run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseDown1StatusLeft    run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseDown1StatusRight   run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseDown1Empty         run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseUp1StatusDefault   run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseUp1StatusLeft      run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseUp1StatusRight     run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseUp1Border          run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseUp1Empty           run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseUp1Pane {
  if-shell -F '#{m/r:^.+$,#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}}' {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  } {
    send-keys -M
  }
}
bind -n MouseDragEnd1StatusDefault   run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseDragEnd1StatusLeft      run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseDragEnd1StatusRight     run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseDragEnd1Border          run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseDragEnd1Empty           run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n C-MouseDragEnd1Status        run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n M-MouseDragEnd1Status        run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n S-MouseDragEnd1Status        run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n C-MouseDragEnd1StatusDefault run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n M-MouseDragEnd1StatusDefault run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n S-MouseDragEnd1StatusDefault run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n C-MouseDragEnd1StatusLeft    run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n M-MouseDragEnd1StatusLeft    run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n C-MouseDragEnd1StatusRight   run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n M-MouseDragEnd1StatusRight   run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n C-MouseDragEnd1Border        run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n M-MouseDragEnd1Border        run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n C-MouseDragEnd1Empty         run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n M-MouseDragEnd1Empty         run-shell -C '#{E:@aipane-status-click-clear-command}'
bind -n MouseDragEnd1Pane {
  if-shell -F '#{m/r:^.+$,#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}}' {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  } {
    send-keys -M
  }
}
bind -n C-MouseDragEnd1Pane {
  if-shell -F '#{m/r:^.+$,#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}}' {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  } {
    send-keys -M
  }
}
bind -n M-MouseDragEnd1Pane {
  if-shell -F '#{m/r:^.+$,#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}}' {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  } {
    send-keys -M
  }
}
bind -n S-MouseDragEnd1Pane {
  if-shell -F '#{m/r:^.+$,#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}}' {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  } {
    send-keys -M
  }
}
bind -n MouseDown1Pane {
  select-pane -t =
  run-shell -C '#{E:@aipane-status-click-clear-command}'
  send-keys -M
}
bind -n MouseDrag1Border {
  run-shell -C '#{E:@aipane-status-click-clear-command}'
  resize-pane -M
}
bind -T copy-mode-vi MouseDown1Pane {
  run-shell -C '#{E:@aipane-status-click-clear-command}'
  select-pane
}
bind -T copy-mode-vi MouseDrag1Pane {
  run-shell -C '#{E:@aipane-status-click-clear-command}'
  select-pane
  send-keys -X begin-selection
}
bind -T copy-mode-vi MouseDragEnd1Pane {
  if-shell -F '#{m/r:^.+$,#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}}' {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  } {
    send-keys -X copy-pipe-and-cancel
  }
}
bind -T copy-mode MouseDown1Pane {
  run-shell -C '#{E:@aipane-status-click-clear-command}'
  select-pane
}
bind -T copy-mode MouseDrag1Pane {
  run-shell -C '#{E:@aipane-status-click-clear-command}'
  select-pane
  send-keys -X begin-selection
}
bind -T copy-mode MouseDragEnd1Pane {
  if-shell -F '#{m/r:^.+$,#{E:##{AIPANE_STATUS_DRAG_#{client_pid}#}}}' {
    run-shell -C '#{E:@aipane-status-click-clear-command}'
  } {
    send-keys -X copy-pipe-and-cancel
  }
}
set -g @aipane-status-drag-prune-command 'live=" $(tmux list-clients -F "##{client_pid}" 2>/dev/null | tr "\n" " ") "; \
  tmux show-environment -gh 2>/dev/null | while IFS= read -r line; do \
    case "$line" in \
      AIPANE_STATUS_DRAG_*=*|AIPANE_STATUS_CLICK_*=*|AIPANE_STATUS_DBLCLICK_*=*) \
        name=${line%%=*}; pid=${name##*_}; \
        case "$live" in *" $pid "*) ;; *) tmux set-environment -gu "$name" ;; esac ;; \
    esac; \
  done'
set-hook -g 'client-detached[7392]' 'run-shell -b -c / "#{E:@aipane-status-drag-prune-command}"'
set-hook -g 'client-session-changed[7392]' 'if-shell -F "#{m/r:^[0-9]+$,#{L:#{?#{==:#{client_name},#{hook_client}},#{client_pid},}}}" { run-shell -C "set-environment -gu AIPANE_STATUS_DRAG_#{L:#{?#{==:#{client_name},#{hook_client}},#{client_pid},}} ; set-environment -gu AIPANE_STATUS_CLICK_#{L:#{?#{==:#{client_name},#{hook_client}},#{client_pid},}} ; set-environment -gu AIPANE_STATUS_DBLCLICK_#{L:#{?#{==:#{client_name},#{hook_client}},#{client_pid},}}" }'
# tmux 3.8 binds MouseDown1Border to select-pane -t =, which would steal focus
# on the first click of DoubleClick1Border. Clicking inside a pane still focuses
# it via MouseDown1Pane, and dragging borders still resizes via MouseDrag1Border.
unbind -n MouseDown1Border
# Double-click any pane top bar → copy that pane's AI session ref (<agent>:<id>) without changing focus
bind -n DoubleClick1Border run-shell -b -c / -t = '$HOME/.local/bin/aipane-sessions yank "#{pane_id}" >/dev/null 2>&1'

# Retain tmux's window menu, with the same guarded close as the last-pane key.
# In tmux 3.8, display-menu attaches to the target window rather than the client;
# bind the menu to the active window (-t #{q:session_name}:) via run-shell -C -t =
# so right-clicking an inactive tab opens visibly while actions target the clicked ID.
bind -n MouseDown3Status run-shell -C -t = 'display-menu -T "#[align=centre]#{window_index}:"#{q:window_name} -t #{q:session_name}: -x "#{mouse_x}" -y W \
  "#{?#{>:#{session_windows},1},,-}Swap Left" l "swap-window -s #{window_id} -t #{q:session_name}:#{e|-:#{window_index},1}" \
  "#{?#{>:#{session_windows},1},,-}Swap Right" r "swap-window -s #{window_id} -t #{q:session_name}:#{e|+:#{window_index},1}" \
  "#{?pane_marked_set,,-}Swap Marked" s "swap-window -t #{window_id}" "" \
  "Kill" X "run-shell -b -c / -t #{window_id} \"####{E:@aipane-close-window-command}\"" \
  "Respawn" R "respawn-window -k -t #{window_id}" \
  "#{?pane_marked,Unmark,Mark}" m "select-pane -m -t #{pane_id}" \
  "Rename" n { command-prompt -t #{window_id} -F -I "####W" { rename-window -t #{window_id} "%%" } } "" \
  "New After" w "new-window -a -t #{window_id}" "New At End" W "new-window -t #{q:session_name}:"'
bind -n M-MouseDown3Status run-shell -C -t = 'display-menu -T "#[align=centre]#{window_index}:"#{q:window_name} -t #{q:session_name}: -x "#{mouse_x}" -y W \
  "#{?#{>:#{session_windows},1},,-}Swap Left" l "swap-window -s #{window_id} -t #{q:session_name}:#{e|-:#{window_index},1}" \
  "#{?#{>:#{session_windows},1},,-}Swap Right" r "swap-window -s #{window_id} -t #{q:session_name}:#{e|+:#{window_index},1}" \
  "#{?pane_marked_set,,-}Swap Marked" s "swap-window -t #{window_id}" "" \
  "Kill" X "run-shell -b -c / -t #{window_id} \"####{E:@aipane-close-window-command}\"" \
  "Respawn" R "respawn-window -k -t #{window_id}" \
  "#{?pane_marked,Unmark,Mark}" m "select-pane -m -t #{pane_id}" \
  "Rename" n { command-prompt -t #{window_id} -F -I "####W" { rename-window -t #{window_id} "%%" } } "" \
  "New After" w "new-window -a -t #{window_id}" "New At End" W "new-window -t #{q:session_name}:"'

# ══════════════════════════════════════════════════════
#  Broadcast (iTerm2-style; Ghostty: Cmd+Opt+I / Cmd+Opt+Shift+I)
# ══════════════════════════════════════════════════════
bind B set-option -w synchronize-panes \
  \; run-shell -b -c / "$HOME/.local/bin/tmux-window-wrap invalidate" \
  \; display "#{?pane_synchronized,Broadcast ON,Broadcast OFF} (current window)"

bind e if-shell -F "#{pane_input_off}" \
  "select-pane -e ; display 'Pane input ON (participating in sync)'" \
  "select-pane -d ; display 'Pane input OFF (excluded from sync)'"

unbind A
unbind O

# Utility popups & session shortcuts
bind P display-popup -E -b rounded -w 86 -h '80%' -x C -y C \
  -T "#[align=centre] colour0-colour255 " \
  "$HOME/.local/bin/tmux-colour-palette"
# Yank the active pane's current AI session ref (<agent>:<id>) (Ghostty: Cmd+Opt+Y)
bind y run-shell -b -c / '$HOME/.local/bin/aipane-sessions yank "#{pane_id}" >/dev/null 2>&1'
# Interactive session & pane picker (Ghostty: Cmd+Opt+P); captures stable origin
# pane/window IDs before opening so index churn cannot retarget paste injection.
bind Q if-shell 'test -x "$HOME/.local/bin/tmux-session-picker"' {
  run-shell -C 'display-popup -E -b rounded -w 88% -h 80% -x C -y C -d / -T "#[align=centre] Sessions " -e "AIPANE_PICKER_ORIGIN_PANE=#{pane_id}" -e "AIPANE_PICKER_ORIGIN_WINDOW=#{window_id}" "$HOME/.local/bin/tmux-session-picker"'
} {
  display-popup -w 50 -h 12 -d / "tmux list-panes -F '#{pane_index}: #{pane_id}  #{pane_current_command}'"
}
