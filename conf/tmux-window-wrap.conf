# tmux-window-wrap — multi-line status window list (owned by aipane)
#
# Install (optional):
#   ln -sf <aipane>/bin/tmux-window-wrap ~/.local/bin/tmux-window-wrap
#   source-file <aipane>/conf/tmux-window-wrap.conf
#
# This file is the public surface only: status-format rows, lifecycle hooks,
# and cache invalidation. Do not put personal prefix/keys/theme/plugins here.
#
# Script path defaults to ~/.local/bin/tmux-window-wrap (symlink to aipane bin).
# After toggling synchronize-panes from your own bindings, also run:
#   run-shell -b "$HOME/.local/bin/tmux-window-wrap invalidate"

# Window labels wrap by available width: 1 line when they fit, up to 3 when not.
# status-left/status-right stay on the first row; continuation rows indent to the
# first-row label origin. The renderer owns window label styles; full window /
# client fingerprints drive format-cache invalidation.
set -g status on
set -g status-format[0] \
  '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#(TMUX_WINDOW_WRAP_GENERATION=#{TMUX_WINDOW_WRAP_GENERATION} TMUX_WINDOW_WRAP_WINDOWS=#{W:#{window_id}_#{window_index}_#{n:window_name}_#{q:window_name}_#{pane_synchronized}__} TMUX_WINDOW_WRAP_CLIENTS=#{L:#{q:session_id}_#{n:client_name}_#{q:client_name}_#{client_width}__} TMUX_WINDOW_WRAP_ACTIVE=#{q:window_id}:#{window_index} $HOME/.local/bin/tmux-window-wrap render --line 0 --session-id #{q:session_id} --width #{client_width} --left-width #{w:#{T;=/#{status-left-length}:status-left}} --right-width #{w:#{T;=/#{status-right-length}:status-right}})#[align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'
set -g status-format[1] \
  '#[align=left]#(TMUX_WINDOW_WRAP_GENERATION=#{TMUX_WINDOW_WRAP_GENERATION} TMUX_WINDOW_WRAP_WINDOWS=#{W:#{window_id}_#{window_index}_#{n:window_name}_#{q:window_name}_#{pane_synchronized}__} TMUX_WINDOW_WRAP_CLIENTS=#{L:#{q:session_id}_#{n:client_name}_#{q:client_name}_#{client_width}__} TMUX_WINDOW_WRAP_ACTIVE=#{q:window_id}:#{window_index} $HOME/.local/bin/tmux-window-wrap render --line 1 --session-id #{q:session_id} --width #{client_width} --left-width #{w:#{T;=/#{status-left-length}:status-left}} --right-width #{w:#{T;=/#{status-right-length}:status-right}})'
set -g status-format[2] \
  '#[align=left]#(TMUX_WINDOW_WRAP_GENERATION=#{TMUX_WINDOW_WRAP_GENERATION} TMUX_WINDOW_WRAP_WINDOWS=#{W:#{window_id}_#{window_index}_#{n:window_name}_#{q:window_name}_#{pane_synchronized}__} TMUX_WINDOW_WRAP_CLIENTS=#{L:#{q:session_id}_#{n:client_name}_#{q:client_name}_#{client_width}__} TMUX_WINDOW_WRAP_ACTIVE=#{q:window_id}:#{window_index} $HOME/.local/bin/tmux-window-wrap render --line 2 --session-id #{q:session_id} --width #{client_width} --left-width #{w:#{T;=/#{status-left-length}:status-left}} --right-width #{w:#{T;=/#{status-right-length}:status-right}})'

# client topology and window lifecycle events do not always rerun cached jobs,
# so advance a monotonic generation and reconcile status height explicitly.
# Use an aipane-specific index instead of the generic [99] slot so sourcing this
# public fragment does not overwrite another fragment's indexed hooks.
set-hook -g 'client-attached[7391]' 'run-shell -b -d 0.02 "$HOME/.local/bin/tmux-window-wrap invalidate"'
set-hook -g 'client-detached[7391]' 'run-shell -b -d 0.02 "$HOME/.local/bin/tmux-window-wrap invalidate"'
set-hook -g 'client-resized[7391]' 'run-shell -b -d 0.02 "$HOME/.local/bin/tmux-window-wrap invalidate"'
set-hook -g 'client-session-changed[7391]' 'run-shell -b -d 0.02 "$HOME/.local/bin/tmux-window-wrap invalidate"'
set-hook -g 'window-linked[7391]' 'run-shell -b -d 0.02 "$HOME/.local/bin/tmux-window-wrap invalidate"'
set-hook -g 'window-unlinked[7391]' 'run-shell -b -d 0.02 "$HOME/.local/bin/tmux-window-wrap invalidate"'
set-hook -g 'window-renamed[7391]' 'run-shell -b -d 0.02 "$HOME/.local/bin/tmux-window-wrap invalidate"'
set-hook -g 'session-renamed[7391]' 'run-shell -b -d 0.02 "$HOME/.local/bin/tmux-window-wrap invalidate"'
run-shell -b "$HOME/.local/bin/tmux-window-wrap invalidate"
