# aipane — Ghostty ↔ tmux keybind bridge (public fragment)
#
# Wire from personal Ghostty config (font/theme stay personal):
#   config-file = /path/to/aipane/conf/ghostty-tmux.conf
#
# Requires tmux prefix = C-Space (see conf/tmux-workstation.conf).
# \x00 is Ctrl-Space. Ghostty sends "prefix + keys" so Cmd chords feel like a GUI.

# Option as Alt so Option+Shift+HJKL and Option+,/. reach tmux as Meta.
macos-option-as-alt = true

# ── Cmd+S = tmux prefix (two-step starter) ────────────
keybind = cmd+s=text:\x00

# ── Common ops: Cmd+key one-shot ─────────────────────
# Cmd+T → prefix+c (new window)
keybind = cmd+t=text:\x00c
# Cmd+W → prefix+x (kill pane, no confirm)
keybind = cmd+w=text:\x00x
# Cmd+D → prefix+| (split horizontal / left-right)
keybind = cmd+d=text:\x00|
# Cmd+Shift+D → prefix+- (split vertical / top-bottom)
keybind = cmd+shift+d=text:\x00-

# Unbind Ghostty defaults that fight the bridge
keybind = super+[=unbind
keybind = super+]=unbind
keybind = super+shift+[=unbind
keybind = super+shift+]=unbind

# Cmd+[ / ] → previous / next pane
keybind = cmd+left_bracket=text:\x00[
keybind = cmd+right_bracket=text:\x00]
# Cmd+Shift+[ / ] → previous / next window
keybind = cmd+shift+left_bracket=text:\x00p
keybind = cmd+shift+right_bracket=text:\x00n
# Cmd+I → rename window; Cmd+Shift+I → rename session
keybind = cmd+i=text:\x00,
keybind = cmd+shift+i=text:\x00$
# Cmd+Shift+Enter → zoom pane
keybind = cmd+shift+enter=text:\x00z

# Cmd+1..9 / Cmd+0 → select window (override Ghostty goto_tab digit_N binds)
keybind = cmd+digit_1=text:\x001
keybind = cmd+digit_2=text:\x002
keybind = cmd+digit_3=text:\x003
keybind = cmd+digit_4=text:\x004
keybind = cmd+digit_5=text:\x005
keybind = cmd+digit_6=text:\x006
keybind = cmd+digit_7=text:\x007
keybind = cmd+digit_8=text:\x008
keybind = cmd+digit_9=text:\x009
keybind = cmd+0=unbind
keybind = cmd+digit_0=text:\x000

# ── Broadcast (pairs with tmux prefix+B / prefix+e) ──
# Cmd+Opt+I → toggle window synchronize-panes
keybind = super+alt+i=text:\x00B
# Cmd+Opt+Shift+I → toggle this pane in/out of sync
# Also map iTerm2-style Cmd+Opt+Ctrl+Shift+I
keybind = super+alt+shift+i=text:\x00e
keybind = super+alt+ctrl+shift+i=text:\x00e

# ── Shift+Enter = newline for AI CLIs in tmux ────────
# Codex 0.128+ accepts Ctrl+J stably under tmux; map Shift+Enter → LF.
keybind = shift+enter=text:\x0a
# CSI-u and ESC-CR variants were unreliable on this Ghostty→tmux path:
# keybind = shift+enter=text:\x1b[13;2u
# keybind = shift+enter=text:\x1b\r
